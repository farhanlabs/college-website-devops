name: Build and Push to Docker Hub

# Yeh workflow kab chalega?
on:
  push:
    branches:
      - main  # Jab bhi aap main branch par 'git push' karoge

jobs:
  build-and-push:
    runs-on: ubuntu-latest  # GitHub hame ek free Ubuntu machine dega ye kaam karne ke liye

    steps:
    # Step 1: GitHub ki machine par aapka repository ka code download (checkout) hoga
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Step 2: Docker Hub me login karega (Taaki image push karne ki permission mile)
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Step 3: Dockerfile ko padh kar image build karega aur direct Docker Hub par push kar dega
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        # Isse aapki image 'username/vision-campus-life:latest' naam se save hogi
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/vision-campus-life:latest